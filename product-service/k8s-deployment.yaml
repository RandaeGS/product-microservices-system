apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z products-db 27017; do echo waiting for mongodb; sleep 2; done;']
      containers:
        - name: product-service
          image: quarkus/product-service-jvm:v1
          imagePullPolicy: Never
          env:
            - name: QUARKUS_PROFILE
              value: "k8s"
            - name: MONGODB_URI
              value: "mongodb://products-db:27017/?replicaSet=rs0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: product-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-db
  template:
    metadata:
      labels:
        app: products-db
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0.4
          command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: products-db
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: products-db
---
apiVersion: batch/v1
kind: Job
metadata:
  name: products-db-init
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:8.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for mongodb to start..."
              until mongosh --host products-db:27017 --eval "print('waiting')" > /dev/null 2>&1; do
                sleep 2
              done
              
              echo "Checking replica set status..."
              if mongosh --host products-db:27017 --eval "rs.status()" > /dev/null 2>&1; then
                echo "Replica set is already initialized."
              else
                echo "Initiating replica set..."
                mongosh --host products-db:27017 --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'products-db:27017'}]})"
              fi
