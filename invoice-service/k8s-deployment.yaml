apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: invoice-service
  template:
    metadata:
      labels:
        app: invoice-service
    spec:
      containers:
        - name: invoice-service
          image: quarkus/invoice-service-jvm:latest
          imagePullPolicy: Never
          env:
            - name: QUARKUS_PROFILE
              value: "k8s"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-service
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
  selector:
    app: invoice-service
